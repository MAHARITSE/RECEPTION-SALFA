# ============================================================
# RECEPTION SALFA - Configuration Apache WAMP
# ============================================================
# Copier ce fichier dans : C:\wamp64\conf\extra\reception-salfa.conf
# Puis ajouter dans httpd.conf : Include conf/extra/reception-salfa.conf
# Redémarrer WAMP après modification.
# ============================================================

Alias /reception-salfa "C:/wamp64/www/reception-salfa"

<Directory "C:/wamp64/www/reception-salfa">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /reception-salfa/

        # Ne pas réécrire les vrais fichiers/dossiers : API PHP, config protégée, assets...
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # Fallback SPA React
        RewriteRule . index.html [L]
    </IfModule>
</Directory>

<IfModule mod_headers.c>
    <Location "/reception-salfa">
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
    </Location>
</IfModule>

# Réseau local : l'application reste accessible par
# http://ADRESSE_IP_DU_SERVEUR/reception-salfa/
# tant que le pare-feu Windows autorise Apache/WAMP sur le port 80.
