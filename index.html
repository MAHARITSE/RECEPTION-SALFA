<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Système de Gestion Hospitalière - Réception, consultation, caisse, pharmacie, magasin, laboratoire, administration, facturation" />
    <meta property="og:title" content="RÉCEPTION SALFA" />
    <meta property="og:description" content="Système de Gestion Hospitalière - Réception, consultation, caisse, pharmacie, magasin, laboratoire, administration, facturation" />
    <meta name="theme-color" content="#f8fafc" />
    <title>RÉCEPTION SALFA — Système de Gestion Hospitalière</title>
    <script>
      // Reprendre la dernière préférence enregistrée dans le navigateur
      // (clair par défaut si aucune préférence n'est stockée).
      // Garder salfa_theme / light alignés avec src/context/ThemeContext.tsx.
      (function() {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('salfa_theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch (e) {}
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.classList.toggle('light', theme === 'light');
        root.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute(
          'content', theme === 'dark' ? '#05070a' : '#f8fafc'
        );
      })();
    </script>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
