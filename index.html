<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediCare HIS — Système d'Information Hospitalier (réception, consultation, caisse, pharmacie, magasin, laboratoire, facturation sociétés)." />
    <meta name="theme-color" content="#f8fafc" />
    <title>MediCare HIS — Système de Gestion Hospitalière</title>
    <script>
      // Démarrage toujours en thème CLAIR (sans tenir compte d'une préférence
      // stockée). Garder aligné avec src/context/ThemeContext.tsx.
      (function() {
        var root = document.documentElement;
        root.classList.remove('dark');
        root.classList.add('light');
        root.dataset.theme = 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8fafc');
      })();
    </script>
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function(val) { originalFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
